[project]
name = "ferry"
version = "0.1.0"
description = "Resumable bulk transfer between hosts that cannot reach each other, relayed through cloud storage"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ferry = "ferry.cli:main"

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ferry"]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11,<0.12"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = ["network: talks to a real cloud backend (run with -m network)"]
